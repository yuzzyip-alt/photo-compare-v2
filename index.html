*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#222;background:#fff}button,a{font:inherit;color:#006bc9}button{border:0;background:transparent;padding:10px;min-height:44px;cursor:pointer}button:disabled{opacity:.35}button.active{background:#dceeff;border-radius:8px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;min-height:48px;padding:0 8px}header strong{font-size:16px}section[hidden],div[hidden]{display:none!important}#list{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.tile{border:1px solid #ddd;border-radius:8px;overflow:hidden}.pair{display:flex;width:100%;padding:0;height:150px;background:#eee}.pair img{width:50%;height:100%;object-fit:contain}.date{font-size:12px;padding:6px;color:#555}.picks{display:flex;gap:12px;padding:16px}.pick{flex:1;min-width:0;height:50vh;background:#f1f3f5;border:1px dashed #aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#006bc9;overflow:hidden}.pick img{width:100%;height:90%;object-fit:contain}.pick input{display:none}.center{text-align:center;padding:12px}#compare{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}#stage{position:relative;flex:1;min-height:0;background:#111;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#slider{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:72%;max-width:560px;background:transparent;display:flex;align-items:center;gap:12px;font-size:14px;color:white;text-shadow:0 1px 3px #000,0 0 5px #000}#slider span{flex:none;font-weight:600}#mix{-webkit-appearance:none;appearance:none;flex:1;min-width:0;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;--mix:50%}#mix::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,#1683ff 0%,#1683ff var(--mi </style></head><body><section id="home"><header><button id="new" aria-label="新規追加" style="font-size:28px">＋</button><strong>Photo Compare 2.1</strong><button id="edit">編集</button></header><div id="notice" role="status"></div><div id="empty">＋を押して比較写真を追加</div><div id="list"></div><div class="center"><button id="backup">バックアップ</button><button id="restore">復元</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div></section><section id="choose" hidden><header><button id="cancel">戻る</button><strong>写真選択</strong><button id="start" disabled>比較開始</button></header><div class="picks"><label class="pick"><span>＋ Before</span><img id="p0" hidden><input id="f0" type="file" accept="image/*"></label><label class="pick"><span>＋ After</span><img id="p1" hidden><input id="f1" type="file" accept="image/*"></label></div><div id="pickStatus" class="center" role="status"></div></section><section id="compare" hidden><div id="stage"><canvas id="c"></canvas><div id="slider"><span>Before</span><input id="mix" aria-label="透過率" type="range" min="0" max="100" value="50"><span>After</span></div></div><div id="tools" hidden><button data-x="-1">←</button><button data-y="-1">↑</button><button data-y="1">↓</button><button data-x="1">→</button><button id="minus">−</button><button id="plus">＋</button><button id="reset">リセット</button></div><div id="bar"><button id="back">‹ 一覧</button><button id="b0">Before</button><button id="b1" class="active">After</button><button id="adjust">微調整</button><button id="save">画像保存</button></div><div id="saveState" role="status"></div></section><section id="export" hidden><header><button id="closeExport">戻る</button><strong>比較画像</strong><a id="download" download="photo-compare.png">保存</a></header><p>画像を長押しして写真に保存できます。</p><img id="result"></section><script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),layer=document.createElement('canvas'),g=layer.getContext('2d');let db,records=[],draft=[null,null],rec=null,ims=[],selected=1,editing=false,urls=[],timer=null,dirty=false,prev=null,loading=[false,false],pickGeneration=0;const initial=()=>({x:0,y:0,z:1});function show(id){['home','choose','compare'].forEach(k=>$(k).hidden=k!==id)}function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function write(r){return new Promise((ok,no)=>{let t=db.transaction('pairs','readwrite');t.objectStore('pairs').put(r);t.oncomplete=ok;t.onabort=t.onerror=()=>no(t.error)})}function remove(id){return new Promise((ok,no)=>{let t=db.transaction('pairs','readwrite');t.objectStore('pairs').delete(id);t.oncomplete=ok;t.onabort=t.onerror=()=>no(t.error)})}function loadImage(blob){return new Promise((ok,no)=>{let u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);no(Error('写真を読み込めません'))};im.src=u})}function thumb(im){let t=document.createElement('canvas'),s=Math.min(1,240/Math.max(im.width,im.height));t.width=Math.max(1,Math.round(im.width*s));t.height=Math.max(1,Math.round(im.height*s));t.getContext('2d').drawImage(im,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.75)}async function refresh(){records=await req(db.transaction('pairs').objectStore('pairs').getAll());records.sort((a,b)=>b.created-a.created);renderList()}function renderList(){$('list').textContent='';$('empty').hidden=!!records.length;records.forEach(r=>{let tile=document.createElement('div');tile.className='tile';let b=document.createElement('button');b.className='pair';b.setAttribute('aria-label','比較を開く');r.thumbs.forEach(src=>{let im=new Image();im.src=src;b.appendChild(im)});b.onclick=()=>openPair(r);tile.appendChild(b);let d=document.createElement('div');d.className='date';d.textContent=new Date(r.created).toLocaleString('ja-JP');tile.appendChild(d);if(editing){let del=document.createElement('button');del.textContent='削除';del.onclick=async()=>{if(confirm('この比較記録を削除しますか？'))try{await remove(r.id);await refresh()}catch(e){alert('削除できませんでした')}};tile.appendChild(del)}$('list').appendChild(tile)})}function clearDraft(){pickGeneration++;urls.forEach(u=>URL.revokeObjectURL(u));urls=[];draft=[null,null];loading=[false,false];[0,1].forEach(i=>{$('p'+i).hidden=true;$('p'+i).removeAttribute('src');$('f'+i).value=''});$('start').disabled=true;$('pickStatus').textContent=''}$('new').onclick=()=>{if(!db)return;clearDraft();show('choose')};$('cancel').onclick=()=>{clearDraft();show('home')};$('edit').onclick=()=>{editing=!editing;$('edit').textContent=editing?'完了':'編集';renderList()};[0,1].forEach(i=>{$('f'+i).onchange=async function(){let f=this.files[0],gen=pickGeneration;if(!f)return;this.value='';loading[i]=true;$('start').disabled=true;try{let im=await loadImage(f);if(gen!==pickGeneration)return;draft[i]={blob:f,thumb:thumb(im)};let u=URL.createObjectURL(f);urls.push(u);$('p'+i).src=u;$('p'+i).hidden=false;$('pickStatus').textContent=''}catch(e){if(gen===pickGeneration)$('pickStatus').textContent='読み込めません。JPEGまたはPNGをお試しください。'}finally{if(gen===pickGeneration){loading[i]=false;$('start').disabled=!draft.every(Boolean)||loading.some(Boolean)}}}});$('start').onclick=async()=>{$('start').disabled=true;let r={id:Date.now()+'-'+Math.random().toString(36).slice(2),created:Date.now(),photos:draft.map(d=>d.blob),thumbs:draft.map(d=>d.thumb),trans:[initial(),initial()],mix:50};try{await write(r);await openPair(r);clearDraft()}catch(e){$('pickStatus').textContent='保存できません。空き容量を確認してください。';$('start').disabled=false}};async function openPair(r){try{ims=await Promise.all(r.photos.map(loadImage));rec=r;dirty=false;$('mix').value=r.mix;$('mix').style.setProperty('--mix',r.mix+'%');select(1);$('tools').hidden=true;$('saveState').textContent='端末内に保存済み';show('compare');resize()}catch(e){alert('写真を開けませんでした entRect(),u=Math.min(r.width,r.height);return [(x-r.left-r.width/2)/u,(y-r.top-r.height/2)/u]}function gesture(t){let p=point(t[0].clientX,t[0].clientY);if(t.length<2)return [...p,0];let q=point(t[1].clientX,t[1].clientY);return [(p[0]+q[0])/2,(p[1]+q[1])/2,Math.hypot(p[0]-q[0],p[1]-q[1])]}function move(n){if(prev)adjust(o=>{let k=prev[2]&&n[2]?Math.max(.2,Math.min(8,o.z*n[2]/prev[2]))/o.z:1;o.x=n[0]-(prev[0]-o.x)*k;o.y=n[1]-(prev[1]-o.y)*k;o.z*=k});prev=n}c.addEventListener('touchstart',e=>{e.preventDefault();prev=gesture(e.touches)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();move(gesture(e.touches))},{passive:false});function end(e){prev=e.touches.length?gesture(e.touches):null;flush().catch(()=>{})}c.addEventListener('touchend',end);c.addEventListener('touchcancel',end);let mouse=false;c.onmousedown=e=>{mouse=true;prev=[...point(e.clientX,e.clientY),0]};window.addEventListener('mousemove',e=>{if(mouse)move([...point(e.clientX,e.clientY),0])});window.addEventListener('mouseup',()=>{if(mouse){mouse=false;prev=null;flush().catch(()=>{})}});$('back').onclick=async()=>{try{await flush();await refresh();rec=null;ims=[];show('home')}catch(e){alert('保存できませんでした。再度お試しください。')}};document.addEventListener('visibilitychange',()=>{if(document.hidden)flush().catch(()=>{})});window.addEventListener('resize',resize);$('save').onclick=()=>{let u=c.toDataURL('image/png');$('result').src=u;$('download').href=u;$('export').hidden=false};$('closeExport').onclick=()=>{$('export').hidden=true;$('result').removeAttribute('src');$('download').removeAttribute('href')};
function dataURL(blob){return new Promise((ok,no)=>{let f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(blob)})}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}$('backup').onclick=async()=>{try{await refresh();let pairs=[];for(let r of records)pairs.push({...r,photos:await Promise.all(r.photos.map(dataURL))});download(new Blob([JSON.stringify({version:2,pairs})],{type:'application/json'}),'photo-compare-backup.json')}catch(e){alert('バックアップできませんでした')}};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async function(){let f=this.files[0];this.value='';if(!f)return;try{let raw=JSON.parse(await f.text());if(raw.version!==2||!Array.isArray(raw.pairs))throw Error();let pairs=[];for(let r of raw.pairs){if(!Array.isArray(r.photos)||r.photos.length!==2||!Array.isArray(r.trans)||r.trans.length!==2||!r.trans.every(o=>[o.x,o.y,o.z].every(Number.isFinite)&&o.z>=.2&&o.z<=8)||!Number.isFinite(r.mix)||r.mix<0||r.mix>100||!Number.isFinite(r.created))throw Error();let photos=await Promise.all(r.photos.map(async s=>{if(typeof s!=='string'||!s.startsWith('data:image/'))throw Error();return (await fetch(s)).blob()}));let images=await Promise.all(photos.map(loadImage));pairs.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),created:r.created,photos,thumbs:images.map(thumb),trans:r.trans,mix:r.mix})}if(!confirm(pairs.length+'件を追加しますか？既存記録は残ります。'))return;for(let r of pairs)await write(r);await refresh()}catch(e){alert('復元できませんでした。容量とファイルを確認してください。')}};async function init(){try{let r=indexedDB.open('les-ailes-photo-compare-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('pairs',{keyPath:'id'});db=await req(r);await refresh()}catch(e){$('notice').textContent='端末内保存を利用できません。通常のSafariまたはホーム画面から開いてください。';$('new').disabled=true}}init();if('serviceWorker'in navigator
